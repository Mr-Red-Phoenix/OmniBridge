spring.application.name=Omni_Bridge

# App Config
app.base.url=${APP_BASE_URL:http://localhost:8081}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.admin-key=${ADMIN_SIGNUP_KEY:admin_dummy_key}
spring.profiles.active=dev
server.port=${PORT:8081}

# JWT Config
jwt.secret=${JWT_SECRET_KEY:nIVPijShbb4HSWTPh3bi0ajvsrCH2C/uttyqbwyNcVyiodzjoCS+trsiSH1um4+IWwCZEb0x1aIXXZE7XTtdmw==}
jwt.expiration-ms=3600000

# OTP Config
otp.expiration-ms=300000
otp.cleanup-rate-ms=60000
otp.length=6
ott.token.expiry.seconds=300
ott.cleanup-rate-ms=300000

# Mail Configuration
spring.mail.from=${MAIL_USERNAME:no-reply@localhost}
brevo.api.key=${BREVO_API_KEY:}

# Rate Limiting Config
rate-limit.duration=1
rate-limit.register=3
rate-limit.auth=20
rate-limit.otp=5
rate-limit.ott=5
rate-limit.report=60

# Logging Config
spring.output.ansi.enabled=always
server.forward-headers-strategy=framework
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){yellow} %clr([%15.15t]){cyan} %clr(%-40.40logger{39}){blue} : %m%n